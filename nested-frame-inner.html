<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inner Nested Frame</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #eef2ff;
        color: #0f172a;
      }
      .frame-label {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 700;
        color: #4f46e5;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      iframe {
        display: block;
        width: 100%;
        height: 220px;
        border: 1px solid #a5b4fc;
        border-radius: 8px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <p class="frame-label" id="innerFrameLabel">Inner frame</p>
    <iframe src="iframe-content.html" id="deepFrame" data-testid="deep-nested-frame" title="Deep nested practice frame"></iframe>
  </body>
</html>
