<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nested Frames</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #f8fafc;
        color: #0f172a;
      }
      .frame-label {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 700;
        color: #6366f1;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      iframe {
        display: block;
        width: 100%;
        height: 285px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <p class="frame-label" id="outerFrameLabel">Outer frame</p>
    <iframe src="nested-frame-inner.html" id="innerFrame" data-testid="inner-frame" title="Inner nested frame"></iframe>
  </body>
</html>
