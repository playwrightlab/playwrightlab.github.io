<html lang="en">

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      (function () {
        var m = document.cookie.match(/(?:^|; )playlab-consent=([^;]*)/);
        var c = {};
        try {
          c = m ? JSON.parse(decodeURIComponent(m[1])) : {};
        } catch (e) {}

    <meta charset="UTF-8" />

    <title>Nested Frames</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #f8fafc;
        color: #0f172a;
      }
      .frame-label {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 700;
        color: #6366f1;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      iframe {
        display: block;
        width: 100%;
        height: 285px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <p class="frame-label" id="outerFrameLabel">Outer frame</p>
    <iframe src="iframe-content.html" id="innerFrame" data-testid="inner-frame" title="Inner nested frame with form"></iframe>
